<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сюрприз для тебя!</title>
    <style>
        body { text-align: center; background: #ffe6ef; font-family: 'Arial', sans-serif; }
        .heart {
            display: inline-block;
            position: relative;
            width: 200px; height: 180px;
            transform: scale(0);
            animation: pop-in 0.6s forwards;
        }
        .heart:before, .heart:after {
            content: '';
            position: absolute;
            top: 0; left: 100px;
            width: 100px; height: 160px;
            background: #f24d6a;
            border-radius: 100px 100px 0 0;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        .heart:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        @keyframes pop-in {
          to { transform: scale(1);}
        }
        .small-heart {
            position: absolute;
            width: 20px;
            height: 18px;
            background: #f24d6a;
            left: 50%;
            top: 50%;
            border-radius: 50% 50% 0 0;
            transform: translate(-50%, -50%) scale(0.7) rotate(-20deg);
            animation: fly 2s infinite alternate;
            opacity: 0.8;
        }
        /* Клонирование маленьких сердечек разным позициям */
        .small-heart:nth-child(2) {top: 35%; left: 60%; animation-delay: .2s;}
        .small-heart:nth-child(3) {top: 55%; left: 65%; animation-delay: .3s;}
        .small-heart:nth-child(4) {top: 30%; left: 40%; animation-delay: .1s;}
        .small-heart:nth-child(5) {top: 60%; left: 55%; animation-delay: .2s;}
        @keyframes fly {
            0% { transform: scale(0.7) translate(-50%, -50%) rotate(-20deg);}
            100% { transform: scale(1.2) translate(-55%, -60%) rotate(20deg);}
        }
        #main-content { margin-top: 80px;}
        .love-msg {
            font-size: 2.5em;
            color: #f24d6a;
            margin-top: 40px;
            font-weight: bold;
            opacity: 0;
            animation: msg 1s forwards 0.7s;
        }
        @keyframes msg {
          to { opacity: 1;}
        }
        #show-surprise {
            background: #f24d6a; color: #fff;
            font-size: 1.2em; padding: 15px 30px;
            border: none; border-radius: 24px;
            box-shadow: 0 0 20px #fff2f4;
            transition: 0.3s;
            cursor: pointer;
            margin-top: 40px;
        }
        #show-surprise:hover {
            background: #f3738a;
            box-shadow: 0 0 60px #fff1fa;
        }
        #surprise {display:none;}
    </style>
</head>
<body>
    <div id="main-content">
        <button id="show-surprise">Нажми меня!</button>
        <div id="surprise">
            <div class="heart"></div>
            <div class="small-heart"></div>
            <div class="small-heart"></div>
            <div class="small-heart"></div>
            <div class="small-heart"></div>
            <div class="small-heart"></div>
            <div class="love-msg">Я тебя очень сильно люблю!</div>
        </div>
    </div>
    <script>
        document.getElementById('show-surprise').onclick = function() {
            document.getElementById('surprise').style.display = "block";
            this.style.display = "none";
        };
    </script>
</body>
</html>
